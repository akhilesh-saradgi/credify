<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="card">
        <h2>Check GitHub Commits</h2>
        <input type="text" id="repoInput" placeholder="owner/repo (e.g., facebook/react)">
        <button id="analyzeBtn">Analyze</button>
    </div>
    <script>
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const input = document.getElementById('repoInput').value.split('/');
            const res = await fetch(`/api/github-check?owner=${input[0]}&repo=${input[1]}`);
            const data = await res.json();
            alert(data.success ? `Found ${data.totalCommits} total commits!` : 'Failed to fetch');
        });
    </script>
</body>
</html>
