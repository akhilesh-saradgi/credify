<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="card">
        <h2>Check GitHub Commits</h2>
        <input type="text" id="repoInput" placeholder="owner/repo (e.g., facebook/react)">
        <button id="analyzeBtn">Analyze</button>
    </div>
   <script>
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const repoValue = document.getElementById('repoInput').value.trim();
            
            if (!repoValue || !repoValue.includes('/')) {
                return alert('Please enter a valid format: owner/repo (e.g., facebook/react)');
            }

            const button = document.getElementById('analyzeBtn');
            button.innerText = 'Analyzing...';

            try {
                // Corrected to match your exact server query parameter layout
                const res = await fetch(`/api/github-check?repo=${repoValue}`);
                const data = await res.json();

                if (data.success) {
                    // Your backend array contains objects inside the 'metrics' list
                    const topContributor = data.metrics[0];
                    alert(`Analysis Success! Found ${data.metrics.length} verified contributors. Top coder: ${topContributor.username} with ${topContributor.totalCommits} commits!`);
                    console.log('Full Repository Contribution Metrics Data Grid:', data.metrics);
                } else {
                    alert(`Engine Error: ${data.error}`);
                }
            } catch (err) {
                console.error(err);
                alert('Failed to communicate with your backend orchestrator engine.');
            } finally {
                button.innerText = 'Analyze';
            }
        });
    </script>
</body>
</html>
